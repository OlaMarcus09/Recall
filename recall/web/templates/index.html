<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        background: #f7f7f5;
        color: #20201d;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 64px auto;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid #c9d8c7;
        border-radius: 6px;
        background: #eef7ed;
        color: #254529;
        font-size: 14px;
        font-weight: 600;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 60ch;
        margin: 0 0 16px;
        font-size: 18px;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #ecebe7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Foundation ready</div>
      <h1>{{ app_name }}</h1>
      <p>
        Recall is ready for the first vertical slice foundation. PDF ingestion,
        retrieval, grounded answers, and citations will be added in later tasks.
      </p>
      <p>Environment: <code>{{ environment }}</code></p>
    </main>
  </body>
</html>
